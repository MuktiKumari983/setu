services:
  mysql:
    image: mysql:8.4
    container_name: sih_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sih_platform}
      MYSQL_USER: ${MYSQL_USER:-sih}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sih_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: sih_ai_service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih_backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/sih_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USERNAME: ${DB_USERNAME:-sih}
      DB_PASSWORD: ${DB_PASSWORD:-sih_password}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32-characters-minimum}
      JWT_ALLOW_DEV_SECRET: ${JWT_ALLOW_DEV_SECRET:-true}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      AI_ENABLED: ${AI_ENABLED:-true}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: sih_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data: